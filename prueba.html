<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800">
  <!-- Barra de navegación -->
  <header class="border-b border-stone-200 bg-stone-100 text-stone-800">
    <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">
      <span class="text-lg font-semibold">CJHA</span>
      <ul class="hidden gap-6 text-sm sm:flex">
        <li><a href="#" class="font-medium text-emerald-800">Pedidos</a></li>
        <li><a href="#" class="hover:text-emerald-600">Clientes</a></li>
        <li><a href="#" class="hover:text-emerald-600">Catálogo</a></li>
      </ul>
      <button type="button" class="rounded-lg bg-stone-800 px-4 py-2 text-sm text-white transition hover:bg-stone-700">
        Nuevo Pedido
      </button>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">
    <!-- Tarjetas de métricas -->
    <section class="grid gap-4 sm:grid-cols-3">
      <article class="rounded-xl border border-stone-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-stone-500">En Producción</p>
        <p class="mt-1 text-3xl font-semibold text-blue-600">18</p>
      </article>
      <article class="rounded-xl border border-stone-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-stone-500">Por entregar</p>
        <p class="mt-1 text-3xl font-semibold text-cyan-600">5</p>
      </article>
      <article class="rounded-xl border border-stone-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-stone-500">Entregados</p>
        <p class="mt-1 text-3xl font-semibold text-emerald-600">45</p>
      </article>
    </section>

    <!-- Tabla de pedidos -->
    <section class="overflow-x-auto rounded-xl border border-stone-200 bg-white shadow-sm">
      <table class="w-full text-left text-sm">
        <thead class="border-b border-stone-200 text-stone-500">
          <tr>
            <th class="p-4 font-medium">Folio</th>
            <th class="p-4 font-medium">Cliente</th>
            <th class="p-4 font-medium">Etapa</th>
            <th class="p-4 font-medium">Entrega</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-stone-100">
          <tr class="hover:bg-stone-50">
            <td class="p-4 font-medium">1045</td>
            <td class="p-4">Casa Talavera</td>
            <td class="p-4">
              <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800">Esmaltado</span>
            </td>
            <td class="p-4">14 oct</td>
          </tr>
          <tr class="hover:bg-stone-50">
            <td class="p-4 font-medium">1053</td>
            <td class="p-4">Hotel Posada</td>
            <td class="p-4">
              <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-800">Empaque</span>
            </td>
            <td class="p-4">12 oct</td>
          </tr>
          <tr class="hover:bg-stone-50">
            <td class="p-4 font-medium">1054</td>
            <td class="p-4">Ana Rivera</td>
            <td class="p-4">
              <span class="rounded-full bg-purple-100 px-3 py-1 text-xs font-medium text-purple-800">Modelado</span>
            </td>
            <td class="p-4">20 oct</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Formulario de registro -->
    <section class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">Registrar Pedido</h2>
      <form class="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <label for="cliente" class="block text-sm text-stone-600">Cliente</label>
          <input 
            id="cliente" 
            name="cliente" 
            type="text" 
            placeholder="Nombre del cliente o empresa"
            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-orange-500 focus:outline-none"
            required
          >
        </div>
        <div>
          <label for="piezas" class="block text-sm text-stone-600">Piezas</label>
          <input 
            id="piezas" 
            name="piezas" 
            type="number" 
            min="1" 
            value="1" 
            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-orange-500 focus:outline-none"
            required
          >
        </div>
        <div class="text-center sm:col-span-2 sm:text-right">
          <button 
            type="submit" 
            class="rounded-lg bg-orange-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2"
          >
            Guardar Pedido
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
